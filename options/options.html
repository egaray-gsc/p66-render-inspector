<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>P66 Render Inspector · Opciones</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>P66 Render Inspector</h1>
      <label>
        Posición del widget
        <select id="corner">
          <option value="top-right">Arriba a la derecha</option>
          <option value="top-left">Arriba a la izquierda</option>
          <option value="bottom-right">Abajo a la derecha</option>
          <option value="bottom-left">Abajo a la izquierda</option>
        </select>
      </label>
      <span id="saved" class="saved" role="status"></span>
    </main>
    <script src="options.js"></script>
  </body>
</html>
